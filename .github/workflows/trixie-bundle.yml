name: Debian Trixie glenv development runtime bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trixie-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build relocatable Debian Trixie sysroot (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve pinned original glenv Wayland workaround
        uses: actions/checkout@v4
        with:
          repository: angyedz/glenv
          ref: 05d3b68a09d8b6e5d84e3b731ef1a2badfc5afd6
          path: original-glenv
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install runtime bundling tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
      - name: Build signed-release-compatible runtime tree
        shell: bash
        run: |
          set -euo pipefail
          version=trixie-glibc-2.41-ci
          export GLENV_RELEASE_VERSION="$version"
          runtime="$RUNNER_TEMP/$version"
          source_runtime="$RUNNER_TEMP/$version-source"
          container="veyra-trixie-bundle-$GITHUB_RUN_ID"
          echo "GLENV_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "GLENV_CONTAINER=$container" >> "$GITHUB_ENV"
          mkdir -p "$source_runtime/sysroot" "$source_runtime/lib"
          docker run -d --name "$container" debian:trixie-slim sleep 1800
          docker exec -e DEBIAN_FRONTEND=noninteractive "$container" sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends               libc6 libstdc++6 coreutils               libwayland-client0 libwayland-egl1               libegl1 libgl1 libgl1-mesa-dri libgbm1 mesa-vulkan-drivers               libgtk-3-0t64 libgdk-pixbuf2.0-bin               gsettings-desktop-schemas adwaita-icon-theme hicolor-icon-theme               libpipewire-0.3-0 libspa-0.2-modules pipewire-bin               libnss3 libasound2t64 libdbus-1-3
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          '
          docker export "$container" | tar -xf - -C "$source_runtime/sysroot"
          gcc -shared -fPIC -O2 -nostdlib             -o "$source_runtime/lib/glenv-wayland-filter.so"             original-glenv/src/shim/glenv-wayland-filter.c

          # GDK loader caches embed Debian /usr paths and cannot blindly be
          # used outside a chroot. Produce a cache for Veyra's stable
          # read-only runtime mount location BEFORE manifest signing.
          pixbuf="$source_runtime/sysroot/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          if [ -f "$pixbuf" ]; then
            sed -i 's#"/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/#"/run/glenv/runtime/sysroot/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/#g' "$pixbuf"
          fi

          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/glenv" ./cmd/glenv
          "$RUNNER_TEMP/glenv" release prepare-copy \
            "$source_runtime" "$runtime" "$version"
          "$RUNNER_TEMP/glenv" doctor --runtime "$runtime"
          "$RUNNER_TEMP/glenv" release --store "$RUNNER_TEMP/glenv-ci-store" stage "$runtime" "$version"
          "$RUNNER_TEMP/glenv" release --store "$RUNNER_TEMP/glenv-ci-store" verify "$version"
          test -f "$RUNNER_TEMP/glenv-ci-store/versions/$version/sysroot/usr/lib/x86_64-linux-gnu/libc.so.6"
      - name: Compress and checksum an unsigned development artifact
        shell: bash
        run: |
          set -euo pipefail
          version=trixie-glibc-2.41-ci
          mkdir -p dist
          tar -C "$RUNNER_TEMP/glenv-ci-store/versions" -I 'zstd -T0 -6'             -cf "dist/veyra-glenv-$version.tar.zst" "$version"
          (cd dist && sha256sum "veyra-glenv-$version.tar.zst" > "veyra-glenv-$version.tar.zst.sha256")
          (cd dist && sha256sum -c "veyra-glenv-$version.tar.zst.sha256")
          du -h dist/*
      - name: Upload unsigned development sysroot
        uses: actions/upload-artifact@v4
        with:
          name: veyra-glenv-trixie-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable Debian container
        if: always()
        run: |
          if [ -n "${GLENV_CONTAINER:-}" ]; then
            docker rm -f "$GLENV_CONTAINER" || true
          fi
