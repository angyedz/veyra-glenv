name: glenv CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glenv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go unit tests and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format sources for isolated CI build
        run: gofmt -w cmd internal
      - name: Unit and regression tests
        run: go test -count=1 -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o /tmp/glenv ./cmd/glenv
      - name: CLI smoke tests
        run: |
          /tmp/glenv version
          /tmp/glenv inspect /bin/true
          /tmp/glenv release --store /tmp/glenv-ci-store status
      - name: Real glibc loader smoke test (host-compatible fixture)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          root=/tmp/glenv-loader-fixture
          mkdir -p "$root/sysroot/lib/x86_64-linux-gnu"
          cp -L /lib64/ld-linux-x86-64.so.2 "$root/sysroot/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2"
          cp -L /lib/x86_64-linux-gnu/libc.so.6 "$root/sysroot/lib/x86_64-linux-gnu/libc.so.6"
          # The filter-name fixture uses host libm to exercise real glibc
          # preload mechanics; it is NOT a test of the original Wayland shim.
          mkdir -p "$root/lib"
          cp -L /lib/x86_64-linux-gnu/libm.so.6 "$root/lib/glenv-wayland-filter.so"
          /tmp/glenv doctor --runtime "$root"
          /tmp/glenv run --runtime "$root" --dry-run /bin/true
          /tmp/glenv run --runtime "$root" /bin/true
      - name: Release inventory and verification smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/glenv-fixture/sysroot/usr/lib
          printf 'glibc fixture' > /tmp/glenv-fixture/sysroot/usr/lib/libc.so.6
          ln -s /usr/lib/libc.so.6 /tmp/glenv-fixture/sysroot/libc.so.6
          /tmp/glenv release inventory /tmp/glenv-fixture fixture-1 > /tmp/glenv-fixture/glenv-manifest.json
          /tmp/glenv release --store /tmp/glenv-ci-store stage /tmp/glenv-fixture fixture-1
          /tmp/glenv release --store /tmp/glenv-ci-store verify fixture-1
          /tmp/glenv release --store /tmp/glenv-ci-store activate fixture-1
          /tmp/glenv release --store /tmp/glenv-ci-store pin /tmp/glenv-boot/runtime
          test "$(basename "$(readlink /tmp/glenv-boot/runtime)")" = fixture-1
          /tmp/glenv release --store /tmp/glenv-ci-store bind-host veyra-test-1 fixture-1
          /tmp/glenv release --store /tmp/glenv-ci-store boot-status
          if /tmp/glenv release --store /tmp/glenv-ci-store boot-pin veyra-wrong /tmp/glenv-boot/paired; then
            echo "Cross-deployment pin unexpectedly succeeded" >&2
            exit 1
          fi
          /tmp/glenv release --store /tmp/glenv-ci-store boot-pin veyra-test-1 /tmp/glenv-boot/paired
          /tmp/glenv release --store /tmp/glenv-ci-store pair-host veyra-slot-A fixture-1
          /tmp/glenv release --store /tmp/glenv-ci-store pair-status veyra-slot-A
          /tmp/glenv release --store /tmp/glenv-ci-store boot-pair-pin veyra-slot-A /tmp/glenv-boot/slot-A
          test "$(basename "$(readlink /tmp/glenv-boot/slot-A)")" = fixture-1
          if /tmp/glenv release --store /tmp/glenv-ci-store boot-pair-pin missing-slot /tmp/glenv-boot/slot-X; then
            echo "Unknown Veyra slot unexpectedly succeeded" >&2
            exit 1
          fi
          /tmp/glenv release --store /tmp/glenv-ci-store status
  alpine:
    name: Alpine musl compilation and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: golang:1.23-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Test on musl
        run: go test -count=1 ./...
      - name: Build on musl
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/glenv ./cmd/glenv
      - name: Check ELF and binary startup
        run: |
          ./dist/glenv version
          ./dist/glenv inspect /bin/busybox
      - name: Pack experimental musl binary with checksums
        run: |
          tar -czf dist/glenv-linux-musl-x86_64.tar.gz -C dist glenv
          cd dist
          sha256sum glenv-linux-musl-x86_64.tar.gz > glenv-linux-musl-x86_64.tar.gz.sha256
      - name: Upload development binary
        uses: actions/upload-artifact@v4
        with:
          name: glenv-linux-musl-x86_64
          path: |
            dist/glenv-linux-musl-x86_64.tar.gz
            dist/glenv-linux-musl-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
