name: Debian Trixie sysroot on Alpine musl

on:
  push:
    branches: [main]
    paths:
      - 'tests/trixie-probe.c'
      - '.github/workflows/trixie-sysroot.yml'
      - 'internal/launcher/**'
      - 'internal/runtime/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trixie:
    name: Real Debian glibc, Mesa, GTK, Wayland and PipeWire ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out original glenv shim without modifying it
        uses: actions/checkout@v4
        with:
          repository: angyedz/glenv
          ref: 05d3b68a09d8b6e5d84e3b731ef1a2badfc5afd6
          path: original-glenv
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build static glenv and glibc ABI probe
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o /tmp/glenv-trixie ./cmd/glenv
          gcc -O2 -Wall -Wextra -Werror -o /tmp/glenv-trixie-probe tests/trixie-probe.c -ldl
      - name: Install real Debian Trixie userspace in disposable Docker container
        shell: bash
        run: |
          set -euo pipefail
          name="veyra-trixie-${GITHUB_RUN_ID}"
          echo "VEYRA_TRIXIE_CONTAINER=$name" >> "$GITHUB_ENV"
          docker run -d --name "$name" debian:trixie-slim sleep 1800
          docker exec -e DEBIAN_FRONTEND=noninteractive "$name" sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends \
              libc6 libstdc++6 coreutils \
              libwayland-client0 libwayland-egl1 \
              libegl1 libgl1 libgl1-mesa-dri libgbm1 mesa-vulkan-drivers \
              libgtk-3-0t64 libpipewire-0.3-0 libspa-0.2-modules \
              libnss3 libasound2t64 libdbus-1-3
            dpkg-query -W libc6 libstdc++6 libwayland-client0 \
              libegl1 libgtk-3-0t64 libpipewire-0.3-0
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          '
      - name: Export sysroot and retain original glenv Wayland shim
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/veyra-trixie-probe
          echo "VEYRA_TRIXIE_ROOT=$root" >> "$GITHUB_ENV"
          mkdir -p "$root/runtime/sysroot" "$root/runtime/lib"
          docker export "$VEYRA_TRIXIE_CONTAINER" | tar -xf - -C "$root/runtime/sysroot"
          gcc -shared -fPIC -O2 -nostdlib \
            -o "$root/runtime/lib/glenv-wayland-filter.so" \
            original-glenv/src/shim/glenv-wayland-filter.c
          cp /tmp/glenv-trixie /tmp/glenv-trixie-probe "$root/"
          test -f "$root/runtime/sysroot/usr/lib/x86_64-linux-gnu/libc.so.6"
          du -sh "$root/runtime/sysroot"
      - name: Run real Debian glibc ELF on Alpine musl host
        shell: bash
        run: |
          set -euo pipefail
          root="$VEYRA_TRIXIE_ROOT"
          docker run --rm \
            -v "$root:$root:ro" \
            -e GLENV_TRIXIE_ROOT="$root" \
            alpine:3.22 sh -ec '
              base=$GLENV_TRIXIE_ROOT
              "$base/glenv-trixie" inspect "$base/runtime/sysroot/usr/bin/true"
              "$base/glenv-trixie" doctor --runtime "$base/runtime"
              "$base/glenv-trixie" run --runtime "$base/runtime" \
                "$base/runtime/sysroot/usr/bin/true"
              LD_DEBUG=files "$base/glenv-trixie" run --runtime "$base/runtime" \
                "$base/glenv-trixie-probe" >/tmp/probe-output 2>/tmp/loader-output
              cat /tmp/probe-output
              grep -F "glenv-wayland-filter.so" /tmp/loader-output
              grep -F "OK PipeWire client" /tmp/probe-output
              grep -F "OK GTK 3" /tmp/probe-output
              grep -F "OK EGL/GLVND" /tmp/probe-output
              grep -F "OK Wayland client" /tmp/probe-output
            '
      - name: Clean up disposable Debian container
        if: always()
        run: |
          if [ -n "${VEYRA_TRIXIE_CONTAINER:-}" ]; then
            docker rm -f "$VEYRA_TRIXIE_CONTAINER" || true
          fi
